# Пакеты Linux: deb, rpm и пакет Arch из одного бинаря (задача linux:package).
# ${VERSION} и ${GOARCH} задаёт задача; описание формата — https://nfpm.goreleaser.com

name: "desktop-app"
arch: ${GOARCH}
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: "yarkovaleksei <yarkovaleksei@users.noreply.github.com>"
description: "Desktop application on Go, Wails 3, React and MUI"
vendor: "yarkovaleksei"
homepage: "https://github.com/yarkovaleksei/desktop-app-template-go-wails"
license: "MIT"
release: "1"

contents:
  # /usr/bin: только у бинаря по этому пути приложение читает метку формата
  # (updater.Naming.DetectFormat) — собранный из исходников рядом с пакетом
  # не примет её на свой счёт.
  - src: "./bin/desktop-app"
    dst: "/usr/bin/desktop-app"
    file_info:
      mode: 0755
  # Иконку окна на Linux даёт ярлык с Icon= и иконка в hicolor (D-041 плана):
  # GTK 4 игнорирует иконку из кода.
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/desktop-app.png"
    file_info:
      mode: 0644
  - src: "./build/linux/desktop-app.desktop"
    dst: "/usr/share/applications/desktop-app.desktop"
    file_info:
      mode: 0644
  # Профиль AppArmor с правилом userns для песочницы WebKitGTK. Только в
  # deb: Fedora живёт на SELinux, в Arch AppArmor не включён по умолчанию.
  - src: "./build/linux/apparmor/desktop-app"
    dst: "/etc/apparmor.d/desktop-app"
    type: config
    packager: deb
    file_info:
      mode: 0644
  # Метка формата: deb, rpm и пакет Arch ставят один и тот же бинарь, и по
  # ней приложение знает, какой пакет скачивать при обновлении.
  - src: "./build/linux/nfpm/package-format/deb"
    dst: "/usr/share/desktop-app/package-format"
    packager: deb
    file_info:
      mode: 0644
  - src: "./build/linux/nfpm/package-format/rpm"
    dst: "/usr/share/desktop-app/package-format"
    packager: rpm
    file_info:
      mode: 0644
  - src: "./build/linux/nfpm/package-format/arch"
    dst: "/usr/share/desktop-app/package-format"
    packager: archlinux
    file_info:
      mode: 0644

# GTK 4 и WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+); у rpm и Arch пакеты
# называются иначе.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora, RHEL, AlmaLinux, Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
