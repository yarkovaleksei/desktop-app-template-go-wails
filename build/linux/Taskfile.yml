version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    # Сборка для Linux требует CGO (GTK 4 и WebKitGTK) и идёт только на Linux.
    preconditions:
      - sh: '[ "{{OS}}" = linux ]'
        msg: "Сборка для Linux идёт только на Linux: нужны CGO, GTK 4 и WebKitGTK"
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          PACKAGE_FORMAT: '{{.PACKAGE_FORMAT}}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.APP_VERSION}}{{if .PACKAGE_FORMAT}} -X main.packageFormat={{.PACKAGE_FORMAT}}{{end}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: deb, rpm и пакет Arch в bin/
    # deb, rpm и пакет Arch несут один бинарь без вшитого формата: формат
    # приложение читает из метки /usr/share/desktop-app/package-format,
    # своей в каждом пакете (nfpm.yaml).
    deps:
      - task: build
    cmds:
      - task: generate:deb
      - task: generate:rpm
      - task: generate:aur

  generate:deb:
    summary: Собрать deb из bin/ (сначала build)
    env: &nfpm-env
      # nfpm.yaml подставляет ${VERSION} и ${GOARCH}. Версия — числовая X.Y.Z:
      # суффикс git describe система пакетов сравнила бы не так, как semver.
      VERSION: "{{.APP_VERSION_NUM}}"
      GOARCH: "{{.ARCH | default ARCH}}"
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:rpm:
    summary: Собрать rpm из bin/ (сначала build)
    env: *nfpm-env
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:aur:
    summary: Собрать пакет Arch из bin/ (сначала build)
    env: *nfpm-env
    cmds:
      - wails3 tool package -name "{{.APP_NAME}}" -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
