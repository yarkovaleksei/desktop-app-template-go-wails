name: Сообщить об ошибке
description: Ошибка в окне Desktop App, настройках, трее, обновлении или установке.
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: >-
        Не вставляйте сюда личные данные: пути с именем пользователя, токены,
        адреса и содержимое своих файлов. Замените их выдуманными
        (`/home/me/demo`).

  - type: dropdown
    id: operating-system
    attributes:
      label: Операционная система
      options:
        - Linux
        - macOS
        - Windows
        - Другая
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Версия ОС
      description: Для Linux укажите дистрибутив, его версию и сеанс (Wayland или X11).
      placeholder: "Например: Ubuntu 24.04 (X11), Fedora 43, macOS 15.4, Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Архитектура системы
      options:
        - x64 (Intel / AMD)
        - arm64 (Apple Silicon / ARM)
        - Другая
        - Не знаю
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Версия Desktop App
      description: >-
        Вывод `desktop-app --version` или версия из имени скачанного файла.
        Для сборки из исходников — commit или тег.
      placeholder: "Например: 1.2.0 (linux/amd64; deb) или commit исходников"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Как установлено приложение
      options:
        - Пакет deb (Ubuntu, Debian)
        - Пакет rpm (Fedora)
        - Пакет Arch Linux
        - AppImage
        - .dmg (macOS)
        - Установщик Windows
        - Переносимый exe (Windows)
        - Собственная сборка из исходников (wails3 task build / package)
        - Режим разработки (wails3 task dev)
        - Другое
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Где ошибка
      multiple: true
      options:
        - Окно не открывается или падает
        - Интерфейс и страницы
        - Настройки, тема, язык
        - Трей, автозапуск, уведомления
        - Обновление из приложения
        - Установка или удаление пакета
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите действия по порядку, начиная с запуска приложения.
      placeholder: |
        1. Запускаю приложение из меню…
        2. Открываю «Настройки» и меняю…
        3. Получаю ошибку…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      placeholder: Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Если появилось сообщение об ошибке, приведите его точный текст.
      placeholder: Что произошло вместо ожидаемого результата?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто повторяется ошибка
      options:
        - При каждом повторении этих действий
        - Иногда
        - Случилось один раз, повторить не удалось
        - Пока не проверял повторно

  - type: textarea
    id: diagnostics
    attributes:
      label: Журнал и диагностика
      description: >-
        Приложите конец файла журнала `desktop-app.log` из каталога журналов
        приложения или вывод терминала, если запускали оттуда. Linux: открывается
        ли окно из меню и из терминала. Windows: установлен ли WebView2. Перед
        отправкой уберите токены и личные пути.
      placeholder: Фрагмент журнала, вывод терминала или код ошибки.
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты и файлы
      description: >-
        Перетащите сюда скриншоты или короткую запись экрана, если они помогают
        показать ошибку. Скройте личные данные.
