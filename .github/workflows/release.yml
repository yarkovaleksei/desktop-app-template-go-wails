# Выпуск по тегу vX.Y.Z: пакеты каждой ОС собираются на своей системе теми же
# задачами, что и локально (package, release:collect), и прикладываются к
# черновику выпуска GitHub вместе с SHA256SUMS-<ОС>.txt. Публикует черновик
# владелец после сверки вложений: wails3 task release:promote. Пакеты не
# подписаны.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux — deb, rpm, Arch, AppImage; Windows — установщик NSIS и
        # переносимый exe; macOS — универсальный .app в .dmg (подпись ad-hoc).
        # Ubuntu закреплена: от неё зависят версии glibc и GTK в пакетах.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Версия — из тега без «v». Явно, а не из git describe: после yarn
      # install и генерации привязок дерево может стать «грязным».
      VERSION: ${{ github.ref_name }}
      # linuxdeploy и AppImage Wails — сами AppImage; на раннере без FUSE они
      # распаковываются и запускаются.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7

      - name: Версия из тега
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: yarn через corepack
        run: corepack enable

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then choco install nsis -y --no-progress; fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: GTK 4 и WebKitGTK 6.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Зависимости фронтенда
        run: wails3 task deps

      - name: Тесты
        run: wails3 task test

      - name: Пакеты
        run: wails3 task package APP_VERSION="$VERSION"

      # Имена по контракту обновлений (updater.Naming) и файл сумм ОС.
      - name: Файлы выпуска
        run: |
          wails3 task release:collect APP_VERSION="$VERSION"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # Черновик создаётся, только если его ещё нет: повторный запуск по тому
      # же тегу докладывает недостающие файлы. Без --clobber: уже загруженный
      # файл не перезаписывается, такая попытка роняет шаг.
      - name: Черновик выпуска
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Desktop App ${GITHUB_REF_NAME#v}" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*
