version: '3'

# Задачи Desktop App. Запуск: `wails3 task <имя>` (или `task <имя>`, если Task установлен отдельно).
# Платформенные задачи сборки и упаковки сгенерированы Wails и лежат в build/.

vars:
  APP_NAME: "desktop-app"
  # Название продукта — для заголовков окон загрузчика AppImage.
  PRODUCT_NAME: "Desktop App"
  BIN_DIR: "bin"
  # Каталог файлов выпуска: пакеты под именами updater.Naming и суммы.
  DIST_DIR: "dist"
  # Репозиторий GitHub, из выпусков которого приходят обновления.
  REPO: "yarkovaleksei/desktop-app-template-go-wails"
  # Состав выпуска — единственный список форматов. release:collect берёт
  # из него форматы своей ОС, release:verify и release:promote сверяют
  # выпуск с ним целиком. Порядок и имена — updater.Format в go-desktop-kit.
  RELEASE_FORMATS: "deb,rpm,arch,appimage,dmg,nsis,exe"
  # Фронтенд ставится и собирается только через yarn 4.
  PACKAGE_MANAGER: "yarn"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Порт локального сервера сайта (задача site); тот же — в .claude/launch.json.
  SITE_PORT: '{{.SITE_PORT | default 8765}}'
  # Целевая ОС для build/package/run. По умолчанию — текущая, переопределяется GOOS.
  GOOS: '{{.GOOS | default OS}}'
  # Версия — из последнего тега vX.Y.Z: у выпуска это сам тег, между тегами —
  # «1.2.0-3-gabc123», без тегов — 0.0.1-dev. Переопределяется переменной
  # окружения VERSION или `wails3 task … APP_VERSION=1.2.0`.
  # Вшивается в бинарь через -X main.version.
  GIT_DESCRIBE:
    sh: git describe --tags --match "v[0-9]*" --dirty 2>/dev/null || echo v0.0.1-dev
  APP_VERSION: '{{.VERSION | default (trimPrefix "v" .GIT_DESCRIBE)}}'
  # Числовая часть X.Y.Z: установщик Windows и Info.plist другой не принимают.
  APP_VERSION_NUM: '{{regexFind "^[0-9]+[.][0-9]+[.][0-9]+" .APP_VERSION | default "0.0.1"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Собрать приложение для текущей ОС
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Собрать установочные пакеты для текущей ОС
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Запустить собранное приложение
    cmds:
      - task: "{{.GOOS}}:run"

  bindings:
    summary: Сгенерировать TypeScript-привязки сервисов и событий во frontend/bindings (коммитятся)
    cmds:
      - task: common:generate:bindings

  check:bindings:
    summary: Проверить, что закоммиченные frontend/bindings совпадают с Go-сервисами
    # Генератор вызывается напрямую, а не через common:generate:bindings: та
    # задача пропускает запуск, если по её контрольным суммам ничего не
    # менялось. Флаги — те же, что у неё. git status ловит и изменённые, и
    # новые, и удалённые файлы привязок.
    cmds:
      - wails3 generate bindings -f '' -clean=true -ts -i
      - cmd: |
          changed=$(git status --porcelain -- frontend/bindings)
          if [ -n "$changed" ]; then
            echo "Привязки устарели — запустите wails3 task bindings и закоммитьте frontend/bindings:"
            echo "$changed"
            exit 1
          fi

  smoke:
    summary: Проверить запуск собранного приложения (сначала build) — окно открылось, фронтенд ответил
    # Профиль пользователя не трогается: каталоги приложения — во временном
    # DESKTOP_APP_HOME, отчёт — в .task/smoke/report.json. Путь абсолютный:
    # относительный appdirs отсчитал бы от домашнего каталога.
    # SMOKE_TIMEOUT=60s — дольше ждать ответа фронтенда.
    vars:
      SMOKE_DIR: '{{.ROOT_DIR}}/.task/smoke'
      SMOKE_TIMEOUT: '{{.SMOKE_TIMEOUT | default "30s"}}'
    env:
      DESKTOP_APP_HOME: '{{.SMOKE_DIR}}/home'
    cmds:
      - rm -rf "{{.SMOKE_DIR}}"
      - mkdir -p "{{.SMOKE_DIR}}/home"
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}" --smoke-report "{{.SMOKE_DIR}}/report.json" --smoke-timeout {{.SMOKE_TIMEOUT}}'
      - >-
        grep -q '"passed": true' "{{.SMOKE_DIR}}/report.json"
      - echo "smoke пройден, отчёт {{.SMOKE_DIR}}/report.json"

  smoke:desktop:
    summary: Linux — запустить окно как из меню, через пользовательский systemd (BIN — по умолчанию /usr/bin/desktop-app, SECONDS — 8)
    # Окно на несколько секунд появится на экране. На macOS и Windows такой
    # проверки нет: задача только сообщает об этом.
    cmds:
      - cmd: bash scripts/smoke-desktop.sh "{{.BIN | default "/usr/bin/desktop-app"}}" "{{.SECONDS | default "8"}}"
        platforms: [linux]
      - cmd: echo "smoke:desktop есть только для Linux; на {{OS}} проверьте запуск из меню вручную"
        platforms: [darwin, windows]

  dev:
    summary: Окно в режиме разработки в .task/dev-home; REAL=true — на настоящих каталогах пользователя
    # Настройки, журнал и кэш разработки живут в .task/dev-home и не смешиваются
    # с установленным приложением. Путь абсолютный: относительный appdirs
    # отсчитал бы от домашнего каталога. Пустое значение при REAL=true значит
    # «переменная не задана» — каталоги обычные. DESKTOP_APP_HOME, уже заданная
    # в окружении, важнее обоих вариантов: так Task обращается с env.
    # WebKitGTK на Linux пишет своё хранилище в ~/.cache/<slug> и
    # ~/.local/share/<slug> мимо переменной.
    env:
      DESKTOP_APP_HOME: '{{if ne .REAL "true"}}{{.ROOT_DIR}}/.task/dev-home{{end}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  ui:
    summary: Интерфейс в браузере на моках, без Go (yarn dev); адрес — http://127.0.0.1:{{.VITE_PORT}}
    dir: frontend
    cmds:
      - yarn dev --port {{.VITE_PORT}}

  site:
    summary: Сайт www/ на локальном сервере (нужен python3); адрес — http://127.0.0.1:{{.SITE_PORT}}
    cmds:
      - python3 -m http.server {{.SITE_PORT}} --bind 127.0.0.1 --directory www

  test:e2e:
    summary: Сквозные сценарии Playwright на моках (Chromium); браузер — yarn playwright install chromium --no-shell
    dir: frontend
    cmds:
      - yarn test:e2e

  deps:
    summary: Установить зависимости фронтенда по yarn.lock без изменений
    dir: frontend
    cmds:
      - yarn install --immutable

  # Пакету main нужен frontend/dist (//go:embed): без него go vet, go test и
  # staticcheck не соберут корневой пакет. Заодно перегенерируются привязки.
  frontend:dist:
    internal: true
    cmds:
      - task: common:build:frontend
        vars:
          DEV: "true"

  test:go:
    summary: Тесты Go — все пакеты модуля, после сборки фронтенда
    deps: [frontend:dist]
    cmds:
      - go test ./...

  test:frontend:
    summary: Тесты фронтенда (Vitest)
    dir: frontend
    cmds:
      - yarn test

  test:
    summary: Все тесты, кроме сквозных (их запускает test:e2e)
    cmds:
      - task: test:go
      - task: test:frontend

  lint:go:
    summary: gofmt, go vet и staticcheck
    deps: [frontend:dist]
    cmds:
      - cmd: |
          unformatted=$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))
          if [ -n "$unformatted" ]; then echo "Не отформатировано gofmt:"; echo "$unformatted"; exit 1; fi
      - go vet ./...
      - go tool staticcheck ./...

  lint:frontend:
    summary: ESLint и Prettier
    dir: frontend
    cmds:
      - yarn lint
      - yarn format:check

  lint:
    summary: Все линтеры
    cmds:
      - task: lint:go
      - task: lint:frontend

  typecheck:
    summary: Проверка типов фронтенда
    dir: frontend
    cmds:
      - yarn typecheck

  fmt:
    summary: Отформатировать Go и фронтенд
    cmds:
      - gofmt -w $(git ls-files --cached --others --exclude-standard '*.go')
      - cd frontend && yarn format

  check:
    summary: Все проверки перед коммитом — зависимости, тесты, типы, линтеры, документы
    cmds:
      - task: deps
      - task: test
      - task: typecheck
      - task: lint
      - task: check:docs

  check:docs:
    summary: Документы и карта кода — ссылки, якоря, пути, задачи и скрипты в Markdown, актуальность docs/code-map.md
    # Пакету проверки не нужны фронтенд и CGO: задача работает и без deps.
    cmds:
      - go test -count=1 ./internal/repodocs

  docs:map:
    summary: Перегенерировать docs/code-map.md из internal/repodocs/areas.go и комментариев пакетов и страниц
    cmds:
      - go test -count=1 ./internal/repodocs -run TestCodeMap -update

  check:race:
    summary: Тесты ядра под детектором гонок
    # Корневой пакет (Wails, GTK через CGO) под -race собирался бы дольше
    # самих тестов, а логики в нём нет: проверяется только internal/.
    cmds:
      - go test -race ./internal/...

  icons:
    summary: Нарисовать шаблонную иконку и картинки сайта из слага (COLOR=#RRGGBB — свой цвет) и обновить производные
    cmds:
      - go run ./scripts/icon -slug "{{.APP_NAME}}" -out build -site www/images{{if .COLOR}} -color "{{.COLOR}}"{{end}}
      - task: icons:derive

  icons:derive:
    summary: Обновить .ico и .icns из build/appicon.png, не трогая саму иконку
    cmds:
      - task: common:generate:icons

  release:collect:
    summary: Разложить пакеты текущей ОС из bin/ в dist/ под именами выпуска и записать SHA256SUMS-<ОС>.txt (сначала package)
    # Версия выпуска — только X.Y.Z: имена файлов и обновление сравнивают
    # её как semver без суффикса git describe.
    vars:
      OS_FORMATS: '{{$m := dict "deb" "linux" "rpm" "linux" "arch" "linux" "appimage" "linux" "dmg" "darwin" "nsis" "windows" "exe" "windows"}}{{$os := .GOOS}}{{$out := list}}{{range splitList "," .RELEASE_FORMATS}}{{if eq (get $m .) $os}}{{$out = append $out .}}{{end}}{{end}}{{join "," $out}}'
    preconditions:
      - sh: echo "{{.APP_VERSION}}" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'
        msg: "Версия выпуска — X.Y.Z (тег vX.Y.Z на текущем коммите или APP_VERSION=X.Y.Z), а сейчас {{.APP_VERSION}}"
      - sh: '[ -n "{{.OS_FORMATS}}" ]'
        msg: "В RELEASE_FORMATS нет форматов для {{.GOOS}}"
    cmds:
      - go tool relkit collect -app "{{.APP_NAME}}" -os "{{.GOOS}}" -version "{{.APP_VERSION}}" -formats "{{.OS_FORMATS}}" -from "{{.BIN_DIR}}" -to "{{.DIST_DIR}}"

  release:plan:
    summary: Только чтение — прежний выпуск, коммиты с него, чистота дерева, HEAD на сервере, CI, следующая версия
    cmds:
      - go tool relkit plan -repo "{{.REPO}}" -workflow check

  release:verify:
    summary: Сверить вложения выпуска vX.Y.Z с полным составом по digest из GitHub API, не скачивая пакеты
    cmds:
      - go tool relkit verify -app "{{.APP_NAME}}" -repo "{{.REPO}}" -version "{{.APP_VERSION}}" -formats "{{.RELEASE_FORMATS}}"

  release:promote:
    summary: Опубликовать черновик vX.Y.Z как latest — только после полной сверки вложений (до и после)
    cmds:
      - go tool relkit promote -app "{{.APP_NAME}}" -repo "{{.REPO}}" -version "{{.APP_VERSION}}" -formats "{{.RELEASE_FORMATS}}"

  version:
    summary: Напечатать версию, которая попадёт в сборку
    silent: true
    cmds:
      - echo "{{.APP_VERSION}}"
